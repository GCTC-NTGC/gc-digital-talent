# Azure Load Testing config for browse_jobs_page.py
# az load test create --load-test-resource <resource> --resource-group <group> --load-test-config-file browse-jobs-page.yaml
version: v0.1
testId: browse-jobs-page
displayName: Browse jobs page
description: Open and closed jobs pages
testType: Locust
testPlan: browse_jobs_page.py
engineInstances: 1
configurationFiles:
  - common.py
  - queries.py
properties:
  userPropertyFile: locust.conf
env:
  - name: LOCALES
    value: en,fr
  - name: THINK_TIME_MIN
    value: "5"
  - name: THINK_TIME_MAX
    value: "15"
  - name: SYNTHETIC_METRICS
    value: "false"
failureCriteria:
  clientMetrics:
    - percentage(error) > 5
autoStop:
  errorPercentage: 50
  timeWindow: 60
