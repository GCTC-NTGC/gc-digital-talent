# Azure Load Testing config for search_page.py
# az load test create --load-test-resource <resource> --resource-group <group> --load-test-config-file search-page.yaml
version: v0.1
testId: search-page
displayName: Search page
description: Search page load and filter changes (CountTalentRequestMatches)
testType: Locust
testPlan: search_page.py
engineInstances: 1
configurationFiles:
  - common.py
  - queries.py
properties:
  userPropertyFile: locust.conf
env:
  - name: LOCALES
    value: en,fr
  - name: THINK_TIME_MIN
    value: "5"
  - name: THINK_TIME_MAX
    value: "15"
  - name: SYNTHETIC_METRICS
    value: "true"
failureCriteria:
  clientMetrics:
    - percentage(error) > 5
autoStop:
  errorPercentage: 50
  timeWindow: 60
