# Azure Load Testing config for public_journeys.py
# az load test create --load-test-resource <resource> --resource-group <group> --load-test-config-file public-journeys.yaml
version: v0.1
testId: public-journeys
displayName: Public journeys
description: Weighted mix of browse open jobs, browse closed jobs and search
testType: Locust
testPlan: public_journeys.py
engineInstances: 1
configurationFiles:
  - common.py
  - queries.py
  - search_page.py
properties:
  userPropertyFile: locust.conf
env:
  - name: OPEN_JOBS_WEIGHT
    value: "50"
  - name: CLOSED_JOBS_WEIGHT
    value: "20"
  - name: SEARCH_WEIGHT
    value: "30"
  - name: THINK_TIME_MIN
    value: "20"
  - name: THINK_TIME_MAX
    value: "60"
  - name: MAX_FILTER_CHANGES
    value: "2"
  - name: SKIP_TLS_VERIFY
    value: "true"
failureCriteria:
  clientMetrics:
    - percentage(error) > 5
autoStop:
  errorPercentage: 50
  timeWindow: 60
