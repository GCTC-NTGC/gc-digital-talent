services:
  postgres:
    image: postgres:16.10
    restart: always
    environment:
      POSTGRES_PASSWORD: password1234
    volumes:
      - ./infrastructure/db:/docker-entrypoint-initdb.d/
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    restart: always
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    links:
      - postgres
    ports:
      - 8080:8080

  webserver:
    build:
      context: ./
      dockerfile: infrastructure/webserver.Dockerfile
    restart: always
    # Azure's init_container.sh takes a startup command and runs it as root
    # before starting nginx and php-fpm. We use it to remap www-data to whoever
    # owns the mounted project, so php-fpm's writes land as files you can edit.
    command: ["/home/site/wwwroot/infrastructure/bin/remap-www-data.sh"]
    volumes:
      - ./:/home/site/wwwroot
      - ./infrastructure/conf/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/conf/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
      - ./infrastructure/conf/php-fpm-www.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./infrastructure/conf/php-fpm-docker.conf:/usr/local/etc/php-fpm.d/docker.conf:ro
    ports:
      - 8000:8080
    environment:
      # Optional override for the uid detection in remap-www-data.sh.
      - HOST_UID
      - HOST_GID
      - ROBOTS_FILENAME=dev.robots.txt
      - WEBSITE_SITE_NAME=localhost
      - GCNOTIFY_API_KEY
      - GCNOTIFY_TEMPLATE_VERIFY_EMAIL_EN
      - GCNOTIFY_TEMPLATE_NOMINATION_RECEIVED_SUBMITTER_EN
      - GCNOTIFY_TEMPLATE_NOMINATION_RECEIVED_SUBMITTER_FR
      - GCNOTIFY_TEMPLATE_NOMINATION_RECEIVED_NOMINATOR_EN
      - GCNOTIFY_TEMPLATE_NOMINATION_RECEIVED_NOMINATOR_FR
      - GCNOTIFY_TEMPLATE_NOMINATION_RECEIVED_NOMINATOR_ENFR
    extra_hosts:
      - "host.docker.internal:host-gateway"

  maintenance:
    build:
      context: ./
      dockerfile: infrastructure/maintenance-container/Dockerfile
    working_dir: /root/scripts
    environment:
      # Optional override for the uid detection in entrypoint-uid.sh.
      HOST_UID: "${HOST_UID:-}"
      HOST_GID: "${HOST_GID:-}"
      # The entrypoint reads HOME before it has a passwd entry to look it up in,
      # and it is what keeps the composer and pnpm caches on the volume below.
      HOME: /root
      # pnpm otherwise puts its store at the filesystem root of the project
      # (/.pnpm-store), which is not writable by a non-root user. Keeping it in
      # HOME also means it persists on the volume between runs.
      npm_config_store_dir: /root/.pnpm-store
      # Docker creates a missing bind-mount target as root, and an older
      # root-run container may have left these behind.
      GCDT_FIX_PATHS: >-
        /home/site/wwwroot/node_modules
        /home/site/wwwroot/api/vendor
        /home/site/wwwroot/api/storage
        /home/site/wwwroot/api/bootstrap/cache
        /home/site/wwwroot/packages/graphql/src/gql
      # pnpm and turbo write into the workspace root itself -- a probe file to
      # pick a store location, a root-level .turbo, debug logs.
      GCDT_FIX_DIRS: /home/site/wwwroot
    deploy:
      mode: replicated
      replicas: 0
    volumes:
      - maintenancedata:/root
      - ./.git:/home/site/wwwroot/.git
      - ./.gitignore:/home/site/wwwroot/.gitignore
      - ./.gitattributes:/home/site/wwwroot/.gitattributes
      - ./maintenance/scripts:/root/scripts
      - ./api:/home/site/wwwroot/api
      - ./apps:/home/site/wwwroot/apps
      - ./packages:/home/site/wwwroot/packages
      - ./tc-report:/home/site/wwwroot/tc-report
      - ./package.json:/home/site/wwwroot/package.json
      - ./pnpm-lock.yaml:/home/site/wwwroot/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/home/site/wwwroot/pnpm-workspace.yaml
      - ./.npmrc:/home/site/wwwroot/.npmrc
      - ./node_modules:/home/site/wwwroot/node_modules
      - ./turbo.json:/home/site/wwwroot/turbo.json

  # We proxy the auth server through apache, so it's at localhost.
  # E.g., http://localhost:8000/oxauth/.well-known/openid-configuration
  #
  # We shouldn't need to expose mock-oauth2-server directly (outside the apache
  # proxy), but if this is required:
  #
  #   1. uncomment the container configuration lines below.
  #   2. add this entry to your `hosts` file:
  #
  #       auth.talent.canada.test 127.0.0.1
  #
  #   3. Rebuild docker container:
  #
  #       $ docker compose up --detach --build mock-auth
  #
  #   4. Confirm working by visiting:
  #
  #       http://auth.talent.canada.test:8081/oxauth/.well-known/openid-configuration
  #
  mock-auth:
    # See: https://github.com/navikt/mock-oauth2-server#standalone-server
    image: ghcr.io/navikt/mock-oauth2-server:6.0.0
    volumes:
      - ./infrastructure/conf:/app/conf
      - ./infrastructure/mockauth/resources/login.html:/app/login/login.html
    # Container shuts down with exit code 143 instead of the standard "0", so
    # we ensure it comes back up after a Docker Desktop console restart.
    # See: https://docs.docker.com/config/containers/start-containers-automatically/#use-a-restart-policy
    restart: unless-stopped
    environment:
      # Things to note in config:
      # - we mock a response but leave out "sub", so that value entered in fake
      #   login form will be used.
      # - we match specifically for client_id `fake-development-client-key`,
      #   which must be set in `.env`.
      # - we set interactiveLogin:true, for easy selection of any test user
      #   (for which subject/sub will be something like `admin@test.com`).
      JSON_CONFIG_PATH: /app/conf/mock-oauth2-server.json
      # Uncomment for direct access without proxy.
      # We override default port 8080 since it is already used by adminer container.
      #SERVER_PORT: 8081
    # Uncomment for direct access without proxy.
    #ports:
    #  - 8081:8081
    #hostname: auth.talent.canada.test

volumes:
  pgdata:
  maintenancedata:
