# Development Docker Compose configuration with hot reloading
#
# Usage:
#   make up ENV=dev
#
# Access the application at: http://localhost:8000

services:
  webserver:
    profiles:
      - disabled

  api:
    build:
      context: ./
      dockerfile: infrastructure/dev/api.Dockerfile
    restart: unless-stopped
    volumes:
      - ./api:/home/site/wwwroot/api
      - ./.git:/home/site/wwwroot/.git:ro
    env_file:
      - ./api/.env
    environment:
      # Optional override for the uid detection in entrypoint-uid.sh.
      HOST_UID: "${HOST_UID:-}"
      HOST_GID: "${HOST_GID:-}"
      GCDT_FIX_PATHS: >-
        /home/site/wwwroot/api/vendor
        /home/site/wwwroot/api/storage
        /home/site/wwwroot/api/bootstrap/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-so", "/dev/null", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  web:
    build:
      context: ./
      dockerfile: infrastructure/dev/web.Dockerfile
    restart: unless-stopped
    volumes:
      - ./apps:/home/site/wwwroot/apps
      - ./packages:/home/site/wwwroot/packages
      - ./package.json:/home/site/wwwroot/package.json
      - ./pnpm-lock.yaml:/home/site/wwwroot/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/home/site/wwwroot/pnpm-workspace.yaml
      - ./.npmrc:/home/site/wwwroot/.npmrc
      - ./turbo.json:/home/site/wwwroot/turbo.json
      - ./.git:/home/site/wwwroot/.git:ro
      - ./node_modules:/home/site/wwwroot/node_modules
      # Share the API storage directory for GraphQL codegen to access the lighthouse schema
      - ./api/storage/app:/home/site/wwwroot/api/storage/app:ro
    env_file:
      - ./apps/web/.env
    environment:
      # Disable devServer redirect since nginx proxy handles routing
      DOCKER_DEV: "true"
      # Optional override for the uid detection in entrypoint-uid.sh.
      HOST_UID: "${HOST_UID:-}"
      HOST_GID: "${HOST_GID:-}"
      # The api dir is not mounted here, so probe something that is.
      GCDT_UID_PROBE: /home/site/wwwroot/apps
      # Docker creates node_modules as root if it does not already exist; the
      # entrypoint taking it over is what the old node-init service did.
      GCDT_FIX_PATHS: /home/site/wwwroot/node_modules
      # pnpm and turbo write into the workspace root itself.
      GCDT_FIX_DIRS: /home/site/wwwroot
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 60s

  # Nginx reverse proxy to route requests between api and web
  nginx-proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/dev/default:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
