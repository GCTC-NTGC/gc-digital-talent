# Regenerates queries.py from the current frontend, builds the single-file Locust
# scripts in apps/locust and publishes them as the "locust-scripts" pipeline
# artifact, ready to upload to Azure Load Testing.
name: $(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

variables:
  serviceConnectionName: "Talent Cloud Service Connection"
  npm_config_user_config: "$(System.DefaultWorkingDirectory)/.npmrc"

pool:
  vmImage: ubuntu-24.04

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: AzureCLI@2
    displayName: "Update NPMRC Config"
    inputs:
      scriptType: bash
      scriptLocation: inlineScript
      azureSubscription: $(serviceConnectionName)
      inlineScript: |
        NPMRC_FILE="$(npm_config_user_config)"
        echo "registry=https://pkgs.dev.azure.com/tbs-sct/53c8b022-82b7-4031-88aa-0d1266fc3bf5/_packaging/TalentCloud_Custom_NPM_Feed/npm/registry/" >> "$NPMRC_FILE"

  - task: npmAuthenticate@0
    displayName: "NPM Authenticate"
    inputs:
      workingFile: $(npm_config_user_config)

  - script: echo "##vso[task.setvariable variable=NPM_CONFIG_USERCONFIG]$(npm_config_user_config)"
    displayName: "Set Custom .npmrc Location"

  - task: NodeTool@0
    displayName: "Use Node.js 24"
    inputs:
      versionSpec: "24.x"

  - script: |
      corepack enable
      corepack prepare pnpm@12.9.1 --activate
    displayName: "Install pnpm"

  # Only the graphql package is needed to run codegen
  - script: pnpm install --frozen-lockfile --filter @gc-digital-talent/graphql...
    displayName: "Install dependencies"

  - script: pnpm --filter @gc-digital-talent/graphql codegen
    displayName: "Run GraphQL codegen"

  - script: node apps/locust/generate_queries.mjs
    displayName: "Generate Locust queries"

  - script: python3 bundle.py
    displayName: Bundle Locust scripts
    workingDirectory: apps/locust

  - task: PublishPipelineArtifact@1
    displayName: Publish Locust scripts
    inputs:
      targetPath: apps/locust/azure
      artifact: locust-scripts
