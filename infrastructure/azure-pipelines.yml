name: $(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)
parameters:
  - name: buildMode
    displayName: Build mode
    type: string
    default: default
    values:
      - default
      - dev
  # Only used by the fallback pipeline that builds from the Azure Repos mirror
  # during a GitHub outage. See documentation/github-outage-fallback.md
  - name: fallback
    displayName: Fallback build (GitHub outage)
    type: boolean
    default: false
  - name: blockGitHub
    displayName: Block GitHub on the agent (fallback drill)
    type: boolean
    default: false
  # "self" uses this pipeline's own latest run on the same branch, for testing before merge
  - name: composerCacheSource
    displayName: Composer cache source (fallback build)
    type: string
    default: main
    values:
      - main
      - self
trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - documentation
      - maintenance
pr: none
resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/main
variables:
  phpVersion: "8.5"

jobs:
  - job: build_artifact
    displayName: Build artifact
    pool:
      vmImage: ubuntu-26.04
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1

      # GitHub runner only includes one version of PHP that is not necessarily the value of the assigned therefore the Personal Package Archive (PPA) is necessary.
      - script: |
          sudo apt-get update
          sudo apt-get -y install lsb-release ca-certificates curl
          sudo curl -sSLo /tmp/debsuryorg-archive-keyring.deb https://packages.sury.org/debsuryorg-archive-keyring.deb
          sudo dpkg -i /tmp/debsuryorg-archive-keyring.deb
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/debsuryorg-archive-keyring.gpg] https://packages.sury.org/php/ $(lsb_release -sc) main" > /etc/apt/sources.list.d/php.list'
          sudo apt-get update
          sudo apt-get install -y php${{ variables.phpVersion }} php${{ variables.phpVersion }}-mbstring php${{ variables.phpVersion }}-xml php${{ variables.phpVersion }}-pgsql php${{ variables.phpVersion }}-zip php${{ variables.phpVersion }}-curl php${{ variables.phpVersion }}-bcmath php${{ variables.phpVersion }}-gd php${{ variables.phpVersion }}-dom php${{ variables.phpVersion }}-intl
        displayName: "Setup PHP"

      - ${{ if parameters.blockGitHub }}:
          - script: echo "0.0.0.0 github.com api.github.com codeload.github.com objects.githubusercontent.com raw.githubusercontent.com release-assets.githubusercontent.com" | sudo tee -a /etc/hosts
            displayName: "Block GitHub"

      # Composer downloads most packages from GitHub, so the fallback build
      # installs from the cache published by the latest main build instead.
      - ${{ if parameters.fallback }}:
          - task: DownloadPipelineArtifact@2
            displayName: "Download composer cache"
            inputs:
              buildType: specific
              project: $(System.TeamProjectId)
              buildVersionToDownload: latestFromBranch
              ${{ if eq(parameters.composerCacheSource, 'self') }}:
                definition: $(System.DefinitionId)
                branchName: $(Build.SourceBranch)
              ${{ else }}:
                definition: $(mainPipelineDefinitionId)
                branchName: refs/heads/main
              artifactName: composer-cache
              targetPath: $(Pipeline.Workspace)/composer-cache

      - script: |
          cd $(System.DefaultWorkingDirectory)/api
          if [ ! -f .env ]; then
            echo "Copying .env file..."
            cp .env.example .env
          else
            echo ".env file already exists, skipping the copy."
          fi
          sudo composer selfupdate
          if [ ${{ parameters.buildMode }} = 'dev' ]; then
            echo "Building dev..."
            composer install
          else
            echo "Building default..."
            composer install --optimize-autoloader --no-dev
          fi
          php artisan lighthouse:print-schema --write
        displayName: Build Backend
        env:
          # Required for bootstrap during lighthouse schema printing
          BROADCAST_CONNECTION: "null"
          COMPOSER_CACHE_DIR: $(Pipeline.Workspace)/composer-cache

      - ${{ if not(parameters.fallback) }}:
          - task: PublishPipelineArtifact@1
            displayName: "Publish composer cache"
            inputs:
              targetPath: $(Pipeline.Workspace)/composer-cache
              artifact: composer-cache

      - script: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"  # This loads nvm
          source ~/.bash_profile
          nvm install v24.22.3
          npm install -g pnpm@12.9.1
          cd $(System.DefaultWorkingDirectory)
          pnpm install --frozen-lockfile
          pnpm run build
        displayName: Build Frontend
        env:
          # Vite requires build-time variable to have the VITE_ prefix
          VITE_API_URI: /graphql
          VITE_API_PROTECTED_URI: /admin/graphql
          VITE_REVERB_APP_KEY: gcdt

      - task: CopyFiles@2
        displayName: "Copy files to staging directory"
        inputs:
          SourceFolder: "$(System.DefaultWorkingDirectory)"
          Contents: |
            api/**
            !api/storage/**
            !api/bootstrap/cache/**
            apps/web/dist/**
            infrastructure/**
          TargetFolder: "$(Build.ArtifactStagingDirectory)/Stage"

      - task: ArchiveFiles@2
        displayName: "Archive Files"
        inputs:
          rootFolderOrFile: "$(Build.ArtifactStagingDirectory)/Stage"
          includeRootFolder: false
          archiveFile: "$(Build.ArtifactStagingDirectory)/Release/Application_$(Build.BuildId).zip"

      - task: PublishBuildArtifacts@1
        displayName: "Publish Artifact: gcDigitalTalent"
        inputs:
          PathtoPublish: "$(Build.ArtifactStagingDirectory)/Release"
          ArtifactName: gcDigitalTalent
